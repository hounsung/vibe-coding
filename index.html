<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#121512">
	<title>자기소개</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<main class="intro">
		<p class="eyebrow">ABOUT ME <span aria-hidden="true">/</span> 자기소개</p>
		<h1>황성현</h1>
		<p class="tagline">3D 그래픽 디자이너</p>

		<section class="favorites" aria-labelledby="favorites-title">
			<div class="section-heading">
				<span class="section-index" aria-hidden="true">01</span>
				<h2 id="favorites-title">좋아하는 게임</h2>
			</div>
			<ul class="game-list">
				<li><span class="game-number">01</span><a class="game-title" href="https://www.minecraft.net/" target="_blank" rel="noopener noreferrer">Minecraft</a></li>
				<li><span class="game-number">02</span><a class="game-title" href="https://www.stardewvalley.net/" target="_blank" rel="noopener noreferrer">Stardew Valley</a></li>
				<li><span class="game-number">03</span><a class="game-title" href="https://zelda.nintendo.com/tears-of-the-kingdom/" target="_blank" rel="noopener noreferrer">젤다의 전설: 티어스 오브 더 킹덤</a></li>
			</ul>
		</section>
		<section class="ideas" aria-labelledby="ideas-title">
			<div class="section-heading">
				<span class="section-index" aria-hidden="true">02</span>
				<h2 id="ideas-title">만든 게임 아이디어</h2>
			</div>
			<textarea class="idea-input" id="game-idea" aria-labelledby="ideas-title" rows="18">제목: 등반
한 줄 설명: 등반하는 게임
플레이어가 하는 일: 방향키를 사용해 산을 등반하는 간단한 게임
게임이 끝나는 조건: 산 정상을 오르면 게임 클리어

제목: 방탈출
한 줄 설명: 갇혀있는 방에서 탈출하는 간단한 게임
플레이어가 하는 일: 마우스를 사용해 방에 있는 퍼즐을 푼다
게임이 끝나는 조건: 모든 퍼즐을 풀어 키를 찾아 문을 열어 탈출하면 승리

제목: 도망가
한 줄 설명: 한 손을 사용하여 뒤에서 달려오는 적을 피해 달려가는 게임
플레이어가 하는 일: 손을 사용해 캐릭터를 조작하여 도망간다
게임이 끝나는 조건: 적에게 붙잡히면 게임 오버</textarea>
		</section>
	</main>
</body>
</html>
